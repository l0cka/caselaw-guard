name: Package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Confirm distributions contain no OpenBench package or dependency
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("caselaw_guard-*.whl"))
          sdist = next(Path("dist").glob("caselaw_guard-*.tar.gz"))

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert not any(PurePosixPath(name).parts[0] == "openbench" for name in names)
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = BytesParser().parsebytes(archive.read(metadata_name))
              requirements = metadata.get_all("Requires-Dist", [])
              assert not any("openbench" in requirement.lower() for requirement in requirements)

          with tarfile.open(sdist) as archive:
              names = [member.name for member in archive.getmembers()]
              assert not any("/openbench/" in name or name.endswith("/openbench") for name in names)
              assert any(name.endswith("/examples/australia_index.sample.json") for name in names)
              assert any(name.endswith("/LICENSE-DATA") for name in names)
              assert any(name.endswith("/DATA_SOURCES.md") for name in names)
          PY

      - name: Locate built wheel
        id: wheel
        run: |
          WHEEL=$(python - <<'PY'
          from pathlib import Path

          print(next(Path("dist").glob("caselaw_guard-*.whl")))
          PY
          )
          echo "path=${WHEEL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test base wheel
        run: |
          python -m venv /tmp/caselaw-guard-base
          /tmp/caselaw-guard-base/bin/python -m pip install --upgrade pip
          /tmp/caselaw-guard-base/bin/python -m pip install "${{ steps.wheel.outputs.path }}"
          /tmp/caselaw-guard-base/bin/caselaw-guard --help
          /tmp/caselaw-guard-base/bin/python - <<'PY'
          from pathlib import Path

          from caselaw_guard.adapters.australia import AustralianCorpusAdapter
          from caselaw_guard.verifier import verify_text

          report = verify_text("No citations here.")
          assert report.pass_ is True
          assert report.results == []

          fixture = Path("examples/australia_index.sample.json").resolve()
          australian = verify_text(
              "[1992] HCA 23 at [10]",
              adapters=[AustralianCorpusAdapter(fixture)],
          )
          assert australian.pass_ is True
          assert len(australian.results) == 1
          assert australian.results[0].status.value == "verified"
          assert australian.results[0].provider_metadata["attribution"]
          PY

      - name: Smoke test MCP extra
        run: |
          python -m venv /tmp/caselaw-guard-wheel
          /tmp/caselaw-guard-wheel/bin/python -m pip install --upgrade pip
          /tmp/caselaw-guard-wheel/bin/python -m pip install "${{ steps.wheel.outputs.path }}[mcp]"
          /tmp/caselaw-guard-wheel/bin/caselaw-guard --help
          /tmp/caselaw-guard-wheel/bin/python - <<'PY'
          import sys
          from pathlib import Path
          from importlib.metadata import entry_points

          scripts = {entry_point.name for entry_point in entry_points(group="console_scripts")}
          assert "caselaw-guard" in scripts
          assert "caselaw-guard-mcp" in scripts
          bin_dir = Path(sys.executable).parent
          assert (bin_dir / "caselaw-guard").exists()
          assert (bin_dir / "caselaw-guard-mcp").exists()

          import asyncio
          import json
          import os

          from mcp import Client
          from mcp.client.stdio import StdioServerParameters, stdio_client

          async def smoke(mode):
              parameters = StdioServerParameters(
                  command=str(bin_dir / "caselaw-guard-mcp"),
                  env=os.environ.copy(),
              )
              async with Client(stdio_client(parameters), mode=mode) as client:
                  tools = await client.list_tools()
                  result = await client.call_tool(
                      "verify_case_law_text",
                      {"text": "No citations here."},
                  )
                  if result.structured_content is not None:
                      payload = result.structured_content
                  else:
                      assert result.content
                      payload = json.loads(result.content[0].text)
                  assert [tool.name for tool in tools.tools] == ["verify_case_law_text"]
                  assert payload == {"pass": True, "results": []}
                  if mode == "legacy":
                      assert client.protocol_version.startswith("2025-")
                  else:
                      assert client.protocol_version == mode

          asyncio.run(smoke("2026-07-28"))
          asyncio.run(smoke("legacy"))
          PY
