name: Publish Australian index

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "CaseLaw Guard ref containing the index builder"
        required: true
        default: "main"
      release_tag:
        description: "Index-specific GitHub release tag"
        required: true
      index_version:
        description: "Version recorded inside the index"
        required: true
      dataset_revision:
        description: "Optional exact upstream dataset revision; otherwise resolve it during the build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and release dependencies
        run: python -m pip install ".[dev,release]"

      - name: Build, validate and run pinned coverage gate
        env:
          INDEX_VERSION: ${{ inputs.index_version }}
          DATASET_REVISION: ${{ inputs.dataset_revision }}
        run: |
          args=(
            --output "australian-index-${INDEX_VERSION}.json"
            --index-version "${INDEX_VERSION}"
          )
          if [ -n "${DATASET_REVISION}" ]; then
            args+=(--dataset-revision "${DATASET_REVISION}")
          fi
          args+=(
            --coverage-baseline benchmarks/auslaw-citation-baseline.json
            --verification-report "australian-index-${INDEX_VERSION}.verification.json"
          )
          python scripts/build_release_index.py "${args[@]}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: australian-index-${{ inputs.index_version }}
          path: australian-index-${{ inputs.index_version }}.json*
          if-no-files-found: error

      - name: Publish index release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Australian index ${{ inputs.index_version }}
          files: australian-index-${{ inputs.index_version }}.json*
